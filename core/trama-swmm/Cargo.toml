# SPDX-License-Identifier: BUSL-1.1
[package]
name = "trama-swmm"
description = "SWMM .inp import and export for TRAMA: the drainage network as a graph."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["swmm", "drainage", "stormwater", "simulation", "trama"]
categories = ["science::geo", "simulation"]

[dependencies]
trama-format.workspace = true
serde_json.workspace = true
# For `inp` (the bracketed-section text shape both EPA formats share) and `Reprojection`. The
# workspace declares it without default features, so there is no C in this: the EPANET engine
# stays behind its feature gate. If a third .inp-family crate ever appears, that shared code
# moves to its own crate; until then a dependency beats a copy.
trama-epanet.workspace = true
# The solver is optional so the importer can reach a browser without carrying the engine.
trama-swmm-sys = { workspace = true, optional = true }
trama-solver = { workspace = true, optional = true }

[features]
default = ["solver"]
solver = ["dep:trama-swmm-sys", "dep:trama-solver"]

[[bin]]
name = "trama-solver-swmm"
path = "src/bin/server.rs"
required-features = ["solver"]

[[bin]]
name = "trama-swmm-wasi"
path = "src/bin/wasi.rs"
required-features = ["solver"]
