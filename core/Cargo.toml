[workspace]
resolver = "3"
members = ["trama-format", "trama-epanet", "trama-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"

[workspace.dependencies]
serde_json = "1"
sha2 = "0.10"
zstd = "0.13"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
