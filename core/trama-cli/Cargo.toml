[package]
name = "trama-cli"
description = "The TRAMA command line: compile, validate, export."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "trama"
path = "src/main.rs"

[dependencies]
trama-format = { path = "../trama-format" }
trama-epanet = { path = "../trama-epanet" }
trama-roads = { path = "../trama-roads" }
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
trama-format = { path = "../trama-format" }
