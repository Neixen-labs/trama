# SPDX-License-Identifier: LicenseRef-BSL-1.1
# The manifest docs/SOLVER_CONTRACT.md section 2 requires of every solver package.
id = "trace"
version = "0.1.0"
license = "LicenseRef-BSL-1.1"
contract_versions = ["0.1.0", "0.2.0"]
# Server only, as with every solver here: the WASM ABI of contract section 5.2 is unimplemented.
runtimes = ["server"]

[inputs]
nodes = true
edges = true
# None required. Cost falls back to hops or to geometric length, both of which every container
# carries; a caller naming a speed column is asking for one this manifest cannot know the name of.
edge_properties = []
node_properties = []

[[outputs]]
channel = "reach"
entity_kind = "edge"
# 1 once the search has reached the edge, 0 before — or a component label, which is an index and
# not a quantity either. Both are counts of nothing, which is what a unitless channel says.
unit = "1"

[params]
schema = { "type" = "object", "additionalProperties" = false, "properties" = { "channel" = { "type" = "string", "default" = "reach" }, "operation" = { "enum" = ["trace", "components", "isolation", "critical", "allocation"], "default" = "trace" }, "cut" = { "type" = "array", "items" = { "type" = "integer", "minimum" = 0 } }, "sources" = { "type" = "array", "minItems" = 1, "items" = { "type" = "integer", "minimum" = 0 } }, "seeds" = { "type" = "array", "minItems" = 1, "items" = { "type" = "integer", "minimum" = 0 } }, "direction" = { "enum" = ["forward", "backward", "both"], "default" = "forward" }, "budget" = { "type" = "number", "minimum" = 0 }, "cost" = { "default" = "length" }, "restriction_property" = { "type" = "string" }, "step_seconds" = { "type" = "number", "exclusiveMinimum" = 0, "default" = 60 } } }
