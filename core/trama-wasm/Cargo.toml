[package]
name = "trama-wasm"
description = "The browser entry point: JSON in, a TRAMA container out."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
trama-format = { path = "../trama-format" }
trama-epanet = { path = "../trama-epanet", default-features = false }
trama-swmm = { path = "../trama-swmm", default-features = false }
trama-example = { path = "../trama-example" }
trama-roads = { path = "../trama-roads" }
trama-power = { path = "../trama-power" }
trama-routing = { path = "../trama-routing" }
trama-trace = { path = "../trama-trace" }
trama-solver = { path = "../trama-solver" }
serde_json.workspace = true
wasm-bindgen = "0.2"
