# SPDX-License-Identifier: LicenseRef-BSL-1.1
# The manifest docs/SOLVER_CONTRACT.md section 2 requires of every solver package.
id = "power-flow"
version = "0.1.0"
license = "LicenseRef-BSL-1.1"
contract_versions = ["0.1.0", "0.2.0"]
# Server only, as with every solver here: the WASM ABI of contract section 5.2 is unimplemented.
# The browser reaches this crate through `trama-wasm`, which is a host embedding it.
runtimes = ["server"]

[inputs]
nodes = true
edges = true
# What a bus and a branch must carry for the load flow to have anything to solve. The rest —
# loads, static generation, the external grid, open switches — travels in the XTRA record the
# compiler carried without reading, so it cannot be declared as a property here.
node_properties = ["power:index", "power:vn_kv"]
edge_properties = ["power:kind", "power:index"]

[[outputs]]
channel = "voltage"
entity_kind = "node"
unit = "p.u."

[[outputs]]
channel = "loading"
entity_kind = "edge"
unit = "%"

# Written only by `study = "fault"`, and only when the external grid declares its fault level.
[[outputs]]
channel = "fault_current"
entity_kind = "node"
unit = "kA"

[params]
schema = { "type" = "object", "additionalProperties" = false, "properties" = { "study" = { "enum" = ["flow", "fault"], "default" = "flow", "description" = "A load flow, or the IEC 60909 maximum short circuit. The latter takes no demand curve: it deliberately ignores the operating state." }, "load_scaling" = { "type" = "array", "minItems" = 1, "items" = { "type" = "number", "minimum" = 0 }, "description" = "One real load flow per multiplier, spread across the interval. Absent means a single flow at t0, the network as the file has it." }, "voltage_channel" = { "type" = "string", "default" = "voltage" }, "loading_channel" = { "type" = "string", "default" = "loading" } } }
