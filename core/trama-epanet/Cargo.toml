[package]
name = "trama-epanet"
description = "EPANET .inp import and export for TRAMA, and the solver that runs it."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
trama-format = { path = "../trama-format" }
serde_json.workspace = true
# Default features drag in js-sys and a CLI; the browser module only needs the maths.
proj4rs = { version = "0.1", default-features = false, features = ["wasm-strict"] }
trama-solver = { path = "../trama-solver", optional = true }
crs-definitions = { version = "0.5.0", default-features = false, features = ["proj4"] }
# The solver is optional so the importer can reach a browser: EPANET is C with a file-based
# API, and wasm32-unknown-unknown has neither libc nor a filesystem to give it.
epanet-sys = { version = "2.3.0", features = ["static-link"], optional = true }

[[bin]]
name = "trama-solver-epanet"
path = "src/bin/server.rs"
required-features = ["solver"]

[features]
default = ["solver"]
solver = ["dep:epanet-sys", "dep:trama-solver"]
