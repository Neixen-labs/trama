[package]
name = "trama-example"
description = "A pulse diffusing over a graph's own topology, to put the solver contract under a real implementation."
version.workspace = true
edition.workspace = true
license.workspace = true
# Not published: this is the contract's demonstration, not a dependency anyone takes. A crate
# name on crates.io is claimed forever, so it is only worth claiming for what someone imports.
publish = false

[[bin]]
name = "trama-solver-example"
path = "src/main.rs"

[dependencies]
trama-format.workspace = true
trama-solver.workspace = true
serde_json.workspace = true
