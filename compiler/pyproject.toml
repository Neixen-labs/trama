[project]
name = "trama-engine"
version = "0.0.0"
description = "Compiler for the TRAMA network-map format"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "zstandard>=0.23",
]

[project.scripts]
trama = "trama_engine.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trama_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
