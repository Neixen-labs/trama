# SPDX-License-Identifier: Apache-2.0
name: Engine checks

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'fixtures/**'
      - '.github/workflows/engine-checks.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'fixtures/**'
      - '.github/workflows/engine-checks.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
