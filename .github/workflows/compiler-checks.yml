# SPDX-License-Identifier: Apache-2.0
name: Compiler checks

on:
  pull_request:
    paths:
      - 'compiler/**'
      - '.github/workflows/compiler-checks.yml'
  push:
    branches: [main]
    paths:
      - 'compiler/**'
      - '.github/workflows/compiler-checks.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run mypy src
