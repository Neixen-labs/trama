# SPDX-License-Identifier: Apache-2.0
name: Solver checks

on:
  pull_request:
    paths:
      - 'solvers/**'
      - 'compiler/**'
      - 'fixtures/**'
      - '.github/workflows/solver-checks.yml'
  push:
    branches: [main]
    paths:
      - 'solvers/**'
      - 'compiler/**'
      - 'fixtures/**'
      - '.github/workflows/solver-checks.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solvers/example-diffusion
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run mypy src
