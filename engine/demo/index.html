<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRAMA demo</title>
    <link rel="stylesheet" href="/engine/node_modules/maplibre-gl/dist/maplibre-gl.css" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0b0f14; color: #e6edf3; }
      #map { position: absolute; inset: 0; }
      #panel {
        position: absolute; z-index: 1; margin: 12px; padding: 10px 12px; max-width: 22rem;
        background: #11161dd9; border: 1px solid #263041; border-radius: 8px; backdrop-filter: blur(6px);
      }
      #panel h1 { margin: 0 0 6px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #7fd1ff; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
      dt { color: #8b98a9; }
      dd { margin: 0; }
      .error { color: #ff9a9a; }
      #time { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
      #time button { font: inherit; color: #cfe9ff; background: #17324a; border: 1px solid #2b5a72; border-radius: 5px; padding: 2px 10px; cursor: pointer; }
      #time button[disabled] { opacity: .5; cursor: default; }
      #scrub { flex: 1; accent-color: #7fd1ff; }
      #clock { min-width: 4.5em; text-align: right; color: #8b98a9; }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>TRAMA</h1>
      <dl id="stats"></dl>
      <div id="time">
        <button id="solve" type="button">solve</button>
        <input id="scrub" type="range" min="0" max="600" step="1" value="0" disabled />
        <output id="clock">—</output>
      </div>
    </div>
    <div id="map"></div>

    <!-- No bundler: tsc emits ESM whose relative imports already end in .js, and this map
         resolves the two bare specifiers straight out of node_modules. -->
    <script type="importmap">
      {
        "imports": {
          "fzstd": "/engine/node_modules/fzstd/esm/index.mjs",
          "maplibre-gl": "/engine/node_modules/maplibre-gl/dist/maplibre-gl.mjs"
        }
      }
    </script>
    <script type="module">
      // maplibre-gl 6 ships named exports only; there is no default.
      import { Map } from "maplibre-gl";
      import { decompress } from "fzstd";

      import { openContainer, httpRangeReader, fetchSection } from "/engine/dist/range.js";
      import { createTramaLayer } from "/engine/dist/maplibre.js";
      import { parseGraph } from "/engine/dist/sections.js";
      import { parseStateChannels, StateRing } from "/engine/dist/state.js";
      import { solveDeltas } from "/engine/dist/solver.js";

      const stats = document.querySelector("#stats");
      const show = (rows) => {
        stats.innerHTML = "";
        for (const [term, value] of rows) {
          stats.insertAdjacentHTML("beforeend", `<dt>${term}</dt><dd>${value}</dd>`);
        }
      };

      // demo-grid.trama by default: network.trama is a three-segment test fixture and reads as
      // a broken demo. ?file= loads anything else in fixtures/.
      const name = new URLSearchParams(location.search).get("file") ?? "demo-grid.trama";
      const url = `/fixtures/${name}`;

      /** Counts what the page actually transfers, so the range loading is visible, not claimed. */
      let transferred = 0;
      const read = (() => {
        const inner = httpRangeReader(url);
        return async (start, end) => {
          const bytes = await inner(start, end);
          transferred += bytes.byteLength;
          return bytes;
        };
      })();

      try {
        const container = await openContainer(read);
        const tiles = container.sections.filter((section) => section.type === "GEOM");
        if (tiles.length === 0) throw new Error("this container holds no GEOM tiles");

        const map = new Map({
          container: "map",
          // A background-only style: the demo shows the network, and stays offline.
          style: { version: 8, sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": "#0b0f14" } }] },
          bounds: boundsOf(tiles),
          fitBoundsOptions: { padding: 48 },
        });

        window.__map = map; // exposed for debugging from the console

        const addLayer = (state) => {
          const created = createTramaLayer({
            id: "trama-network",
            container,
            read,
            decompress: (stored) => decompress(stored),
            style: { widthPixels: 2.5, color: [0.49, 0.82, 1, 1] },
            resolutionPixels: () => [map.getCanvas().width, map.getCanvas().height],
            state,
          });
          map.addLayer(created);
          return created;
        };

        map.on("load", () => addLayer(undefined));

        const SOLVER = "http://127.0.0.1:8801/solve";
        const CHANNEL_NAME = "flow";
        const scrub = document.querySelector("#scrub");
        const clock = document.querySelector("#clock");
        const solveButton = document.querySelector("#solve");
        let solverStatus = "not run";
        let layer = null;

        // GRPH and STCH stay unfetched until state is wanted: drawing geometry never needs them.
        async function buildRing() {
          const find = (type) => container.sections.find((section) => section.type === type);
          const inflate = (stored) => decompress(stored);
          const graph = parseGraph(await fetchSection(read, find("GRPH"), inflate));
          const channels = parseStateChannels(await fetchSection(read, find("STCH"), inflate));
          const channel = channels.find((candidate) => candidate.name === CHANNEL_NAME);
          if (channel === undefined) throw new Error(`this container declares no ${CHANNEL_NAME} channel`);
          const ring = new StateRing({
            channels,
            nodeIds: graph.nodes.map((node) => node.id),
            edgeIds: graph.edges.map((edge) => edge.id),
            slots: 16,
            slotSeconds: 60,
          });
          return { ring, channel };
        }

        solveButton.addEventListener("click", async () => {
          solveButton.disabled = true;
          try {
            solverStatus = "loading graph";
            report();
            const { ring, channel } = await buildRing();
            const state = {
              ring,
              channelId: channel.channelId,
              // Ramps from 0 rather than the declared minimum: this solver writes non-negative
              // magnitudes, and mapping the whole declared range would paint rest at mid-ramp.
              range: [0, channel.declaredMax],
              highColor: [1, 0.72, 0.2, 1],
              timeSeconds: () => Number(scrub.value),
            };
            map.removeLayer("trama-network");
            layer = addLayer(state);

            solverStatus = "solving";
            report();
            let applied = 0;
            for await (const payload of solveDeltas(SOLVER, {
              tramaUrl: new URL(url, location.href).href,
              params: { channel: CHANNEL_NAME },
              t0Seconds: 0,
              t1Seconds: Number(scrub.max),
            })) {
              applied += ring.apply(payload);
            }
            layer.refreshState();
            scrub.disabled = false;
            solverStatus = `${applied} deltas`;
          } catch (error) {
            solverStatus = `<span class="error">${error.message}</span>`;
          }
          solveButton.disabled = false;
          report();
        });

        scrub.addEventListener("input", () => {
          clock.textContent = `${scrub.value} s`;
          map.triggerRepaint();
          report();
        });

        const report = () =>
          show([
            ["file", name],
            ["sections", container.sections.map((section) => section.type).join(" ")],
            ["tiles", tiles.length],
            ["zoom", map.getZoom().toFixed(2)],
            ["transferred", `${transferred} B`],
            ["solver", solverStatus],
          ]);
        report();
        map.on("render", report);
      } catch (error) {
        show([["error", `<span class="error">${error.message}</span>`]]);
      }

      /** Frames whatever container it is given, from its GEOM tile keys. */
      function boundsOf(tiles) {
        const corners = tiles.flatMap(({ key: [z, x, y] }) => [
          lonLat(z, x, y),
          lonLat(z, x + 1, y + 1),
        ]);
        const longitudes = corners.map(([longitude]) => longitude);
        const latitudes = corners.map(([, latitude]) => latitude);
        return [Math.min(...longitudes), Math.min(...latitudes), Math.max(...longitudes), Math.max(...latitudes)];
      }

      function lonLat(z, x, y) {
        const tiles = 2 ** z;
        const n = Math.PI - (2 * Math.PI * y) / tiles;
        return [(x / tiles) * 360 - 180, (180 / Math.PI) * Math.atan(Math.sinh(n))];
      }
    </script>
  </body>
</html>
