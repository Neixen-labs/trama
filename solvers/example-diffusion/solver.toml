id = "example-diffusion"
version = "0.1.0"
license = "LicenseRef-BSL-1.1"
contract_versions = ["0.1.0"]
runtimes = ["server"]

[inputs]
nodes = true
edges = true
edge_properties = []
node_properties = []

[[outputs]]
channel = "flow"
entity_kind = "edge"
unit = "l/s"

[params]
schema = {"type" = "object", "properties" = {"channel" = {"type" = "string", "default" = "flow"}, "seed_node_index" = {"type" = "integer", "minimum" = 0, "default" = 0}, "step_seconds" = {"type" = "number", "exclusiveMinimum" = 0, "default" = 60}, "speed_hops_per_step" = {"type" = "number", "exclusiveMinimum" = 0, "default" = 1.5}, "amplitude" = {"type" = "number", "default" = 40}}, "additionalProperties" = false}
