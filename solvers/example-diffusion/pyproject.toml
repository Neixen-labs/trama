[project]
name = "trama-solver-example-diffusion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["trama-engine"]

[dependency-groups]
dev = ["mypy>=2.3.0", "pytest>=8.0", "ruff>=0.16.2"]

[tool.uv.sources]
trama-engine = { path = "../../compiler" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_diffusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
