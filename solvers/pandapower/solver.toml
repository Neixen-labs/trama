# SPDX-License-Identifier: LicenseRef-BSL-1.1
# The manifest docs/SOLVER_CONTRACT.md section 2 requires of every solver package.
id = "pandapower"
version = "0.1.0"
license = "LicenseRef-BSL-1.1"
contract_versions = ["0.1.0", "0.2.0", "0.3.0"]
# Server only. There is no WASM build: pandapower is Python on NumPy and SciPy, and the point
# of this solver is that a server runtime lets a domain arrive in whatever language it lives in.
runtimes = ["server"]

[inputs]
nodes = true
edges = true
# The electrical parameters travel as opaque `power:` keys and the solver rebuilds whole tables
# from them, so no single column is required by name here.
edge_properties = []
node_properties = []

# Per unit, always: a load flow reports bus voltage against the bus's own nominal, so the unit
# does not depend on whether the network is in kV or V.
[[outputs]]
channel = "voltage"
entity_kind = "node"
unit = "p.u."

# Percent of the element's rating, for lines and transformers alike.
[[outputs]]
channel = "loading"
entity_kind = "edge"
unit = "%"

[params]
schema = { "type" = "object", "additionalProperties" = false, "properties" = { "voltage_channel" = { "type" = "string", "default" = "voltage" }, "loading_channel" = { "type" = "string", "default" = "loading" }, "load_scaling" = { "type" = "array", "items" = { "type" = "number", "minimum" = 0 }, "default" = [], "description" = "One load flow per multiplier, spread across [t0, t1]. Empty means a single run at t0: the daily curve is the caller's to supply, not this solver's to invent." } } }
