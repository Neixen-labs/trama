[project]
name = "trama-solver-epanet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["trama-engine", "pyproj>=3.6"]

[project.entry-points."trama.importers"]
epanet = "trama_epanet.importer:EpanetImporter"

[dependency-groups]
# owa-epanet only verifies the round trip: both files are simulated and compared. It ships a
# cp312 manylinux wheel, so CI needs no toolchain; there is no macOS wheel for this Python,
# and a local build wants swig and ninja on PATH.
dev = ["mypy>=2.3.0", "owa-epanet>=2.3", "pytest>=8.0", "ruff>=0.16.2"]

[tool.uv.sources]
trama-engine = { path = "../../compiler" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trama_epanet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The SWIG bindings ship no py.typed marker, so the toolkit arrives untyped. Silencing it here
# keeps the rest of the package strictly checked instead of turning the setting off globally.
[[tool.mypy.overrides]]
module = "epanet.*"
ignore_missing_imports = true
